name: SimplicityHL toolchain
author: Blockstream Research
description: Install a precompiled Simplex toolchain, including bundled tools

branding:
  icon: terminal
  color: purple

inputs:
  components:
    description: >-
      Required Simplex selection: simplex or simplex@VERSION.
    required: true

outputs:
  simplex-version:
    description: Installed Simplex version
    value: ${{ steps.install.outputs.simplex-version }}

runs:
  using: composite
  steps:
    - id: install
      name: Install the Simplex toolchain
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        GITHUB_TOKEN: ${{ github.token }}
      run: "$GITHUB_ACTION_PATH/install"
