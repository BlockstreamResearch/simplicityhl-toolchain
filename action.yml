name: SimplicityHL toolchain
author: Blockstream Research
description: Install a precompiled Simplex toolchain

branding:
  icon: terminal
  color: purple

inputs:
  components:
    description: >-
      Optional comma-separated list of components. Currently supports simplex
      and simplex@VERSION.
    required: false
    default: "simplex"

outputs:
  simplex-version:
    description: Installed Simplex version
    value: ${{ steps.install.outputs.simplex-version }}

runs:
  using: composite
  steps:
    - id: install
      name: Install SimplicityHL components
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        GITHUB_TOKEN: ${{ github.token }}
      run: "$GITHUB_ACTION_PATH/install"
