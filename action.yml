name: SimplicityHL toolchain
author: Blockstream Research
description: Install a precompiled Simplex toolchain

branding:
  icon: terminal
  color: purple

inputs:
  simplex:
    description: Simplex version to install (latest, v0.2.0, or 0.2.0)
    required: false
    default: "latest"

outputs:
  simplex-version:
    description: Installed Simplex version
    value: ${{ steps.install.outputs.simplex-version }}

runs:
  using: composite
  steps:
    - id: install
      name: Install Simplex
      shell: bash
      env:
        SIMPLEX_VERSION: ${{ inputs.simplex }}
        GITHUB_TOKEN: ${{ github.token }}
      run: "$GITHUB_ACTION_PATH/install"
