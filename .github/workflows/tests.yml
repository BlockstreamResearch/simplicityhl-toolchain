name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dev

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Shell checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check Bash syntax
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          bash -n install

      - name: Install ShellCheck when unavailable
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          if command -v shellcheck >/dev/null 2>&1; then
            exit 0
          fi

          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          else
            apt-get update
            apt-get install --yes shellcheck
          fi

      - name: Run ShellCheck
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          shellcheck install

  install-simplex:
    name: Install Simplex (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - id: default
        name: Install the default Simplex release
        uses: ./

      - id: explicit
        name: Reinstall the resolved Simplex release explicitly
        uses: ./
        with:
          components: simplex@${{ steps.default.outputs.simplex-version }}

      - name: Verify Simplex installations
        shell: bash
        env:
          DEFAULT_VERSION: ${{ steps.default.outputs.simplex-version }}
          EXPLICIT_VERSION: ${{ steps.explicit.outputs.simplex-version }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          test -n "$DEFAULT_VERSION"
          test "$DEFAULT_VERSION" = "$EXPLICIT_VERSION"
          simplex --version | grep --fixed-strings "$DEFAULT_VERSION"

  fixture:
    name: Example project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install the project Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"

      - name: Record Rust and Cargo versions
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          rustc --version > "$RUNNER_TEMP/rustc-before"
          cargo --version > "$RUNNER_TEMP/cargo-before"

      - id: toolchain
        name: Install Simplex with the local action
        uses: ./
        with:
          components: simplex

      - name: Verify the installed toolchain
        shell: bash
        env:
          SIMPLEX_VERSION: ${{ steps.toolchain.outputs.simplex-version }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          test -n "$SIMPLEX_VERSION"
          simplex --version | grep --fixed-strings "$SIMPLEX_VERSION"
          test "$(cat "$RUNNER_TEMP/rustc-before")" = "$(rustc --version)"
          test "$(cat "$RUNNER_TEMP/cargo-before")" = "$(cargo --version)"

      - name: Check SimplicityHL formatting
        working-directory: example
        run: simplex fmt --check

      - name: Generate contract artifacts
        working-directory: example
        run: simplex build

      - name: Build
        working-directory: example
        run: cargo build --locked --all-features

      - name: Run Simplex tests
        working-directory: example
        run: simplex test -v

  invalid-inputs:
    name: Invalid input handling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Reject invalid component inputs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          invalid_inputs=(
            unknown
            simplex,simplex
            simplex@
            simplex@0.0.0-does-not-exist
          )

          for components in "${invalid_inputs[@]}"; do
            if COMPONENTS="$components" GITHUB_OUTPUT="$RUNNER_TEMP/invalid-output" ./install; then
              printf 'expected components=%s to fail\n' "$components" >&2
              exit 1
            fi
          done
